<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jawwad AI Cinema Studio | Cloudflare Workers AI</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen flex flex-col font-sans">

  <header class="border-b border-zinc-800 px-6 py-4 flex flex-wrap justify-between items-center gap-4">
    <div>
      <h1 class="font-bold text-lg text-white">Jawwad AI Cinema Studio <span class="text-xs bg-orange-500/20 text-orange-300 border border-orange-500/30 px-2 py-0.5 rounded-full ml-2">Cloudflare Workers AI</span></h1>
      <p class="text-xs text-zinc-400">Llama 3.3 Storyboard + Flux-1-Schnell 3D Scene Renderer + Video Exporter</p>
    </div>
    <div class="flex items-center gap-2">
      <input id="workerUrl" type="text" value="https://jawwad-ai-proxy.muhammadjawwad94.workers.dev"
        class="bg-zinc-900 border border-zinc-700 rounded-lg px-3 py-1.5 text-xs w-80 text-white" />
      <button onclick="saveWorkerUrl()" class="px-3 py-1.5 bg-orange-600 hover:bg-orange-500 text-xs font-semibold rounded-lg">Save URL</button>
    </div>
  </header>

  <main class="flex-1 grid grid-cols-1 lg:grid-cols-12 gap-6 p-6 max-w-7xl w-full mx-auto">
    <!-- Left Controls -->
    <section class="lg:col-span-5 bg-zinc-900 border border-zinc-800 rounded-xl p-5 space-y-4">
      <div>
        <label class="block text-xs font-semibold uppercase text-zinc-400 mb-1.5">Video Idea / Story Prompt</label>
        <textarea id="topicInput" rows="3" placeholder="e.g. A cute baby astronaut finding a glowing crystal cave on Mars, 3D Pixar style"
          class="w-full bg-zinc-950 border border-zinc-800 rounded-lg p-3 text-sm text-white focus:outline-none focus:border-orange-500"></textarea>
      </div>

      <div class="grid grid-cols-2 gap-3 text-xs">
        <div>
          <label class="block text-zinc-400 mb-1">Aspect Ratio</label>
          <select id="ratioSelect" onchange="resizeCanvas()" class="w-full bg-zinc-950 border border-zinc-800 rounded-lg p-2.5">
            <option value="9:16">9:16 (YouTube Shorts)</option>
            <option value="16:9">16:9 (Widescreen)</option>
          </select>
        </div>
        <div>
          <label class="block text-zinc-400 mb-1">Camera Motion</label>
          <select id="motionSelect" class="w-full bg-zinc-950 border border-zinc-800 rounded-lg p-2.5">
            <option value="zoom-in">Slow Dolly Push-In</option>
            <option value="pan">Smooth Cinema Pan</option>
          </select>
        </div>
      </div>

      <button id="genBtn" onclick="generateFullVideo()"
        class="w-full py-3 bg-gradient-to-r from-orange-600 to-amber-600 hover:from-orange-500 hover:to-amber-500 text-white font-bold text-sm rounded-lg shadow-lg transition">
        Generate AI Scenes & Render Video
      </button>

      <div class="bg-zinc-950 border border-zinc-800 rounded-lg p-3 text-xs">
        <span class="text-zinc-400">Status: </span>
        <span id="statusText" class="text-emerald-400 font-mono">Connected to Cloudflare Worker - Ready!</span>
      </div>

      <div id="scenesList" class="space-y-2.5 max-h-72 overflow-y-auto text-xs"></div>
    </section>

    <!-- Right Video Output -->
    <section class="lg:col-span-7 bg-zinc-900 border border-zinc-800 rounded-xl p-5 flex flex-col items-center justify-between space-y-4">
      <div class="w-full flex justify-between items-center text-xs">
        <span class="uppercase font-semibold text-zinc-400">Generated AI Video Output</span>
        <span id="sceneIndicator" class="font-mono text-orange-400">Ready</span>
      </div>

      <div class="flex-1 w-full flex items-center justify-center bg-zinc-950 rounded-xl border border-zinc-800 p-4">
        <canvas id="renderCanvas" width="360" height="640" class="rounded-lg max-h-[440px] w-auto bg-black"></canvas>
        <video id="outputVideo" controls loop class="hidden rounded-lg max-h-[440px] w-auto bg-black"></video>
      </div>

      <a id="downloadLink" download="jawwad-cloudflare-ai-video.webm"
        class="hidden w-full py-3 bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs rounded-lg text-center block">
        ⬇ Download Generated Video (.WebM)
      </a>
    </section>
  </main>

  <script>
    const DEFAULT_WORKER = "https://jawwad-ai-proxy.muhammadjawwad94.workers.dev";
    const canvas = document.getElementById("renderCanvas");
    const ctx = canvas.getContext("2d");
    const videoEl = document.getElementById("outputVideo");
    const downloadLink = document.getElementById("downloadLink");

    let generatedScenes = [];
    let frame = 0;

    const savedUrl = localStorage.getItem("cf_worker_url") || DEFAULT_WORKER;
    document.getElementById("workerUrl").value = savedUrl;

    function saveWorkerUrl() {
      const url = document.getElementById("workerUrl").value.trim().replace(/\/$/, "");
      if (!url) return alert("Please enter your Cloudflare Worker URL!");
      localStorage.setItem("cf_worker_url", url);
      document.getElementById("statusText").textContent = "Saved Worker URL!";
    }

    function resizeCanvas() {
      const r = document.getElementById("ratioSelect").value;
      if (r === "9:16") { canvas.width = 360; canvas.height = 640; }
      else { canvas.width = 640; canvas.height = 360; }
    }

    async function generateFullVideo() {
      const workerUrl = (document.getElementById("workerUrl").value.trim() || DEFAULT_WORKER).replace(/\/$/, "");
      const topic = document.getElementById("topicInput").value.trim() || "Cute baby astronaut finding glowing crystals on Mars, 3D Pixar style";
      const btn = document.getElementById("genBtn");
      const status = document.getElementById("statusText");

      btn.disabled = true;
      btn.textContent = "Generating AI Story & Images...";
      videoEl.classList.add("hidden");
      canvas.classList.remove("hidden");
      downloadLink.classList.add("hidden");

      try {
        status.textContent = "Agent 1: Writing 4-scene script (Llama 3.3)...";
        const scriptRes = await fetch(workerUrl, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ type: "script", prompt: topic }),
        });
        const scriptJson = await scriptRes.json();
        const rawText = scriptJson.response || "";
        const jsonMatch = rawText.match(/\{[\s\S]*\}/);
        const parsed = jsonMatch ? JSON.parse(jsonMatch[0]) : {
          scenes: [
            { subtitle: "Look what was hiding in the cave...", image_prompt: `${topic}, wide shot, 3D Pixar render, 8k` },
            { subtitle: "Every crystal glows with pure magic!", image_prompt: `${topic}, close-up wonder, glowing crystals, 3D Pixar style` },
            { subtitle: "Suddenly the entire world lights up!", image_prompt: `${topic}, dramatic volumetric lighting, 3D animation` },
            { subtitle: "Subscribe for more 3D AI stories!", image_prompt: `${topic}, cute smiling hero, vibrant colors, Pixar style` }
          ]
        };

        const scenesData = parsed.scenes.slice(0, 4);
        document.getElementById("scenesList").innerHTML = scenesData.map((s, i) => `
          <div class="p-2.5 bg-zinc-950 border border-zinc-800 rounded-lg">
            <div class="font-bold text-orange-400">Scene ${i + 1}: ${s.subtitle}</div>
            <div class="text-zinc-500 mt-0.5">${s.image_prompt}</div>
          </div>
        `).join("");

        generatedScenes = [];
        for (let i = 0; i < scenesData.length; i++) {
          status.textContent = `Agent 2: Rendering AI Image ${i + 1}/4 (Flux-1-Schnell)...`;
          const imgRes = await fetch(workerUrl, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ type: "image", prompt: scenesData[i].image_prompt }),
          });
          const imgJson = await imgRes.json();
          if (imgJson.image) {
            const imgObj = await loadBase64Image("data:image/png;base64," + imgJson.image);
            generatedScenes.push({ img: imgObj, subtitle: scenesData[i].subtitle });
          }
        }

        if (generatedScenes.length === 0) throw new Error("No images returned from Cloudflare AI.");

        status.textContent = "Agent 3: Encoding 8s Video Sequence...";
        frame = 0;
        const stream = canvas.captureStream(30);
        const recorder = new MediaRecorder(stream, { mimeType: "video/webm" });
        const chunks = [];
        recorder.ondataavailable = (e) => { if (e.data.size > 0) chunks.push(e.data); };
        recorder.onstop = () => {
          const blob = new Blob(chunks, { type: "video/webm" });
          const url = URL.createObjectURL(blob);
          canvas.classList.add("hidden");
          videoEl.src = url;
          videoEl.classList.remove("hidden");
          videoEl.play();

          downloadLink.href = url;
          downloadLink.classList.remove("hidden");
          status.textContent = "Done! Video Ready to Play & Download.";
          btn.disabled = false;
          btn.textContent = "Generate AI Scenes & Render Video";
        };

        recorder.start();
        setTimeout(() => recorder.stop(), 8000);

      } catch (err) {
        status.textContent = "Error: " + err.message;
        btn.disabled = false;
        btn.textContent = "Generate AI Scenes & Render Video";
        alert("Error: " + err.message);
      }
    }

    function loadBase64Image(src) {
      return new Promise((resolve) => {
        const img = new Image();
        img.onload = () => resolve(img);
        img.src = src;
      });
    }

    function renderLoop() {
      frame++;
      const w = canvas.width;
      const h = canvas.height;
      ctx.fillStyle = "#09090b";
      ctx.fillRect(0, 0, w, h);

      if (generatedScenes.length > 0) {
        const idx = Math.floor((frame / 60) % generatedScenes.length);
        const scene = generatedScenes[idx];
        document.getElementById("sceneIndicator").textContent = `Scene ${idx + 1} / ${generatedScenes.length}`;

        const t = (frame % 60) / 60;
        const motion = document.getElementById("motionSelect").value;
        const scale = motion === "zoom-in" ? 1 + t * 0.14 : 1.12;
        const panX = motion === "pan" ? (t - 0.5) * 30 : 0;

        ctx.save();
        ctx.translate(w / 2 + panX, h / 2);
        ctx.scale(scale, scale);

        const imgAspect = scene.img.width / scene.img.height;
        const canvasAspect = w / h;
        let drawW, drawH;
        if (imgAspect > canvasAspect) {
          drawH = h;
          drawW = h * imgAspect;
        } else {
          drawW = w;
          drawH = w / imgAspect;
        }
        ctx.drawImage(scene.img, -drawW / 2, -drawH / 2, drawW, drawH);
        ctx.restore();

        ctx.fillStyle = "rgba(0,0,0,0.75)";
        ctx.fillRect(14, h - 74, w - 28, 54);
        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 13px sans-serif";
        ctx.fillText(scene.subtitle.slice(0, 44), 24, h - 42);
      } else {
        ctx.fillStyle = "#71717a";
        ctx.font = "13px sans-serif";
        ctx.textAlign = "center";
        ctx.fillText("AI Generated Video Preview Will Appear Here", w / 2, h / 2);
        ctx.textAlign = "left";
      }

      requestAnimationFrame(renderLoop);
    }

    renderLoop();
  </script>
</body>
</html>
